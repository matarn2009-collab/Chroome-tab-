<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1f1f1f;--muted:#5f6368;--pill:#edf0f5;--card:#f4f6fa;--chip:#e3e7ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a120d;--fg:#ebe0d4;--muted:#d6c8b9;--pill:#40372e;--card:#261f1a;--chip:#3b332d}}
:root[data-theme="dark"]{--bg:#1a120d;--fg:#ebe0d4;--muted:#d6c8b9;--pill:#40372e;--card:#261f1a;--chip:#3b332d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Google Sans",Roboto,Arial,sans-serif;padding:0 14px 24px;box-sizing:border-box}
main{max-width:640px;margin:0 auto}
.logo{font-family:"Outfit","Google Sans",Arial,sans-serif;font-weight:500;font-size:62px;letter-spacing:-.045em;text-align:center;margin:44px 0 38px;line-height:1;color:var(--fg)}
.pill{display:flex;align-items:center;gap:14px;height:58px;padding:0 14px 0 16px;border-radius:29px;background:var(--pill);box-sizing:border-box}
.pill input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:19px}
.pill input::placeholder{color:var(--muted)}
.pill button,.pill a{flex:none;width:40px;height:40px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);cursor:pointer;padding:0}
.pill button:focus-visible,.pill a:focus-visible,.tile:focus-visible{outline:2px solid #8ab4f8;outline-offset:2px}
.card{margin-top:14px;padding:18px 12px 16px;border-radius:28px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;text-decoration:none;cursor:pointer;padding:0;min-width:0}
.ico{width:52px;height:52px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500}
.tile span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add .ico{font-size:34px;font-weight:300}
.new{display:none;gap:8px;flex-direction:column;margin-top:16px}
.new.open{display:flex}
.new input{height:44px;border:0;border-radius:22px;background:var(--chip);color:var(--fg);padding:0 18px;font:inherit;font-size:16px;outline:0}
.new input::placeholder{color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end}
.row button{height:40px;padding:0 20px;border:0;border-radius:20px;font:inherit;font-size:15px;cursor:pointer;background:var(--chip);color:var(--fg)}
.row .ok{background:#8ab4f8;color:#1a120d}
</style>
</head>
<body>
<main>
  <h1 class="logo">Google</h1>
  <form id="f" class="pill" action="https://www.google.com/search" method="get" target="_blank">
    <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    <input id="q" name="q" type="text" autocomplete="off" placeholder="Search Google or type…" aria-label="Search Google or type a URL">
    <button type="button" id="mic" aria-label="Voice search"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
    <a href="https://lens.google.com" target="_blank" rel="noopener" aria-label="Search with Google Lens"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12V9.5a3 3 0 0 0-3-3H16L15 4.5H9L8 6.5H6.5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3H12"/><circle cx="12" cy="13.5" r="3.2"/><circle cx="19" cy="19" r="1.7" fill="currentColor" stroke="none"/></svg></a>
  </form>

  <section class="card" aria-label="Shortcuts">
    <div class="grid" id="grid">
      <button class="tile add" id="add" type="button"><span class="ico">+</span><span>Add new</span></button>
    </div>
    <form class="new" id="new">
      <input id="nn" placeholder="Name" aria-label="Shortcut name" maxlength="24">
      <input id="nu" placeholder="URL" aria-label="Shortcut URL" inputmode="url" autocapitalize="off">
      <div class="row"><button type="button" id="cancel">Cancel</button><button class="ok" type="submit">Done</button></div>
    </form>
  </section>
</main>
<script>
var KEY='ntp-shortcuts',list=[],grid=document.getElementById('grid'),addBtn=document.getElementById('add'),form=document.getElementById('new');
try{list=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){list=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
function fix(u){return /^https?:\/\//i.test(u)?u:'https://'+u}
function render(){
  grid.querySelectorAll('.sc').forEach(function(n){n.remove()});
  list.forEach(function(s,i){
    var a=document.createElement('a');a.className='tile sc';a.href=s.url;a.target='_blank';a.rel='noopener';
    var ic=document.createElement('span');ic.className='ico';ic.textContent=(s.name[0]||'?').toUpperCase();
    var t=document.createElement('span');t.textContent=s.name;
    a.append(ic,t);
    var p;a.addEventListener('contextmenu',function(e){e.preventDefault();if(confirm('Remove '+s.name+'?')){list.splice(i,1);save();render()}});
    grid.insertBefore(a,addBtn);
  });
  addBtn.style.display=list.length>=8?'none':'';
}
addBtn.onclick=function(){form.classList.add('open');document.getElementById('nn').focus()};
document.getElementById('cancel').onclick=function(){form.classList.remove('open');form.reset()};
form.onsubmit=function(e){
  e.preventDefault();
  var u=document.getElementById('nu').value.trim(),n=document.getElementById('nn').value.trim();
  if(!u)return;
  u=fix(u);
  if(!n){try{n=new URL(u).hostname.replace(/^www\./,'')}catch(x){n=u}}
  list.push({name:n,url:u});save();render();form.classList.remove('open');form.reset();
};
document.getElementById('f').addEventListener('submit',function(e){
  var v=document.getElementById('q').value.trim();
  if(!v){e.preventDefault();return}
  if(/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v)){e.preventDefault();window.open(fix(v),'_blank','noopener')}
});
document.getElementById('mic').onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){window.open('https://www.google.com','_blank','noopener');return}
  try{var r=new SR();r.lang=document.documentElement.lang||'en';
    r.onresult=function(ev){document.getElementById('q').value=ev.results[0][0].transcript;document.getElementById('f').requestSubmit()};
    r.start()}catch(x){}
};
render();
</script>
</body>
</html>
